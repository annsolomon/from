global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Services run on the Codespace host (scripts/run.sh services), reached via host-gateway.
  - job_name: dexter-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [
          'host.docker.internal:8080',
          'host.docker.internal:8081',
          'host.docker.internal:8082',
          'host.docker.internal:8083',
          'host.docker.internal:8084',
          'host.docker.internal:8085',
          'host.docker.internal:8086',
          'host.docker.internal:8087',
          'host.docker.internal:8088',
          'host.docker.internal:8089'
        ]
