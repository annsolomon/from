# Trail kit (MASTER_PLAN 11.2). THROWAWAY - deleted in P19.
# Host header is always set explicitly: Tomcat answers 400 to a Host containing "_".
# Live mode goes through this same-origin proxy so the browser never needs CORS:
#   /api/...           -> gateway (host:8080)
#   /svc/<name>/...    -> that service directly (dev debugging only)
upstream svc-gateway { server host.docker.internal:8080; }
upstream svc-identity { server host.docker.internal:8081; }
upstream svc-ledger { server host.docker.internal:8082; }
upstream svc-catalog { server host.docker.internal:8083; }
upstream svc-portfolio { server host.docker.internal:8084; }
upstream svc-planning { server host.docker.internal:8085; }
upstream svc-reco { server host.docker.internal:8086; }
upstream svc-billing { server host.docker.internal:8087; }
upstream svc-commerce { server host.docker.internal:8088; }
upstream svc-audit { server host.docker.internal:8089; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;

  location / {
    try_files $uri $uri/ =404;
  }

  location /api/ {
    proxy_pass http://svc-gateway/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location ~ ^/svc/([a-z]+)/(.*)$ {
    proxy_pass http://svc-$1/$2$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
