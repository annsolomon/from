<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dexter v2 — full frontend (mock + live)</title>
<style>:root{--bg:#f6f4ef;--panel:#fff;--ink:#16181d;--ink2:#4a4f5a;--mute:#8a8f99;--line:#e6e2d9;--side:#14161b;--side2:#1e2128;--sideink:#c9ccd3;--acc:#e8772e;--acc2:#0f8b7d;--accbg:#fdf0e6;--ok:#14864d;--okbg:#e7f6ee;--warn:#b7791f;--warnbg:#fdf5e1;--bad:#c2372f;--badbg:#fcebea;--info:#2c62c9;--infobg:#e9f0fc;--r:10px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}a.btn{text-decoration:none;display:inline-block}html,body{margin:0;height:100%}body{font:14px/1.45 var(--sans);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}a{color:var(--info)}
#app{display:grid;grid-template-columns:248px 1fr;height:100vh}
#side{background:var(--side);color:var(--sideink);overflow-y:auto;padding:14px 10px 40px}
#side .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;color:#fff;font-weight:700;font-size:17px;letter-spacing:.2px}
#side .brand i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#f2b23a);display:inline-block}
#side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6c717c;margin:14px 8px 5px}
#side a.nav{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;border-radius:7px;color:var(--sideink);text-decoration:none;font-size:13.2px;cursor:pointer}
#side a.nav:hover{background:var(--side2);color:#fff}#side a.nav.on{background:#2a2e37;color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
#side a.nav small{font-size:10.5px;color:#7d828c}
#main{display:flex;flex-direction:column;min-width:0;height:100vh}
#top{display:flex;align-items:center;gap:10px;padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top .title{font-weight:650;font-size:16px;margin-right:auto}
#content{flex:1;overflow-y:auto;padding:18px 22px 120px}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,96vw);background:#0f1115;color:#d6d9df;transform:translateX(100%);transition:transform .2s;z-index:50;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
#drawer.open{transform:none}#drawer header{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #262a33}
#drawer .log{overflow-y:auto;flex:1;padding:8px}
.call{border:1px solid #262a33;border-radius:8px;margin-bottom:8px;background:#151820}
.call summary{cursor:pointer;padding:7px 9px;display:flex;gap:8px;align-items:center;font:12px var(--mono)}
.call pre{margin:0;padding:8px 10px;border-top:1px solid #262a33;font:11.5px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.m{font:700 10.5px var(--mono);padding:2px 5px;border-radius:4px;min-width:46px;text-align:center}
.m.GET{background:#173b2f;color:#5fe0b0}.m.POST{background:#3a2a10;color:#ffbe5c}.m.PATCH{background:#2b2342;color:#b9a2ff}.m.PUT{background:#1c2c48;color:#83b4ff}.m.DELETE{background:#431c1c;color:#ff8f8f}
.st{font:700 11px var(--mono);margin-left:auto}.st.s2{color:#5fe0b0}.st.s3{color:#83b4ff}.st.s4{color:#ffbe5c}.st.s5{color:#ff8f8f}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card h3 .sp{margin-left:auto}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){#app{grid-template-columns:1fr}#side{position:fixed;z-index:40;width:250px;height:100vh;transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}.g2,.g3,.g4{grid-template-columns:1fr}#content{padding:12px}}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.3px}.kpi .l{color:var(--mute);font-size:12px}.kpi .s{font-size:12px;color:var(--ink2)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#cfc9bc}.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.a{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.g{background:var(--acc2);border-color:var(--acc2);color:#fff}.btn.d{color:var(--bad);border-color:#f0c9c6}.btn.sm{padding:3px 8px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink);min-width:0}
textarea{font:12px var(--mono);width:100%}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}label.f input,label.f select{font-size:13.5px;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{align-items:flex-end}.sp{flex:1}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px;background:#fbfaf7;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.hl td{background:#fff8ef}tr.click{cursor:pointer}tr.click:hover td{background:#faf8f3}
.tw{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:8px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:#efece5;color:var(--ink2);white-space:nowrap}

.note{border-left:3px solid var(--info);background:var(--infobg);padding:8px 11px;border-radius:0 8px 8px 0;font-size:13px;margin:8px 0}

#toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:#0007;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:16px 18px}

.tree{font-size:13px}.tree div{padding:2px 0}.tree .p{font:12px var(--mono);color:var(--ink2)}

  const h = t.toString(16).padStart(12, '0');
  const r = () => Math.floor(Math.random() * 65536).toString(16).padStart(4, '0');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-7${r().slice(1)}-${(8 + Math.floor(Math.random() * 4)).toString(16)}${r().slice(1)}-${r()}${r()}${r()}`;
}

const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function on(sel, ev, fn, root = document) { $$(sel, root).forEach((el) => el.addEventListener(ev, (e) => fn(e, el))); }

function modal(title, body, bind) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><div class="row"><h3 style="margin:0">${title}</h3><span class="sp"></span><button class="btn sm" data-x>Close</button></div><div class="mbody" style="margin-top:10px">${body}</div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.hasAttribute('data-x')) close(); });
  if (bind) bind(bg, close);
  return close;
}

  const p = limit ? Math.min(100, used / limit * 100) : 0;

}

function pointsBalance(acct) {

const pager = { buffer: [], shown: 0, cursor: null, hasMore: true, inflight: false, filters: {}, calls: [] };
function pagerInit() {

  const r = call('GET', '/v1/expenses?limit=50' + (qs ? '&' + qs : ''));
  if (r.status !== 200) { pager.buffer = []; pager.shown = 0; return; }
  pager.buffer = r.body.data; pager.cursor = r.body.page.nextCursor; pager.hasMore = r.body.page.hasMore; pager.shown = Math.min(25, pager.buffer.length); pager.calls = [{ limit: 50, got: r.body.data.length }];
}
function pagerVisible(i) { // 1-based index of the last visible item; MASTER_PLAN §4.4 window
  if (i >= pager.shown - 1) {
    if (pager.shown < pager.buffer.length) pager.shown = Math.min(pager.shown + 25, pager.buffer.length);
    if (pager.hasMore && !pager.inflight) {
      pager.inflight = true; const qs = new URLSearchParams(Object.fromEntries(Object.entries(pager.filters).filter(([, v]) => v))).toString();
      setTimeout(() => { const r = call('GET', '/v1/expenses?limit=25&cursor=' + encodeURIComponent(pager.cursor) + (qs ? '&' + qs : '')); if (r.status === 200) { const ids = new Set(pager.buffer.map((x) => x.id)); pager.buffer.push(...r.body.data.filter((x) => !ids.has(x.id))); pager.cursor = r.body.page.nextCursor; pager.hasMore = r.body.page.hasMore; pager.calls.push({ limit: 25, got: r.body.data.length }); } pager.inflight = false; drawPager(); }, 250);

/** typing → category/merchant → offers, deals, rates, best held card → offer-adjusted budget (client-composed; A-75 gap) */

  const P = (state.sub.planner = state.sub.planner || {});

   <div class="note warn small"><b>Honest status:</b> the backend has no single "map my budget to offers" endpoint — <span class="mono">GET /v1/budgets/category-potential</span> was planned in P13 and deferred (A-75), and budget creation never looks at offers. This page shows the mapping <b>composed on the client</b> from five endpoints that do exist. <button class="btn sm" id="gap">Call the missing endpoint</button></div>
   <div class="row"><div class="ac" style="flex:1;min-width:260px"><input id="pq" placeholder="Type: swiggy · food delivery · flights · groceries · uber…" value="${esc(P.q || '')}" style="width:100%" autocomplete="off"><div class="list" style="display:none"></div></div>
   <label class="f">Monthly limit ₹ (blank = your 3-month average)<input id="pl" style="width:150px" value="${P.limit ? P.limit / 100 : ''}"></label></div><div id="pOut" style="margin-top:12px"></div></div>`;
  $('#gap', B).onclick = () => { call('GET', '/v1/budgets/category-potential?category=food.delivery'); $('#drawer').classList.add('open'); };
  const inp = $('#pq', B), list = $('.ac .list', B);

    const cats = CATS().filter((c) => c.name.toLowerCase().includes(q) || c.path.includes(q.replace(/\s+/g, '_'))).slice(0, 5).map((c) => ({ kind: 'category', label: c.name, path: c.path }));
    const r = call('GET', '/v1/merchants/autocomplete?q=' + encodeURIComponent(q), { quiet: true }); const ms = ((r.body || {}).data || []).slice(0, 6).map((m) => ({ kind: 'merchant', label: m.name, path: m.category, merchantId: m.merchantId }));
    const all = [...cats, ...ms]; list.innerHTML = all.map((x, i) => `<div data-i="${i}"><span>${x.kind === 'merchant' ? '🏪' : '🗂️'} ${esc(x.label)}</span><span class="mono mute">${x.kind} · ${x.path}</span></div>`).join(''); list.style.display = all.length ? 'block' : 'none';
    $$('[data-i]', list).forEach((d) => (d.onclick = () => { const x = all[+d.dataset.i]; list.style.display = 'none'; inp.value = x.label; Object.assign(P, { q: x.label, pick: x, limit: v('#pl', B) ? P2R(v('#pl', B)) : null }); plannerRun(B, P); }));
  };

}
function plannerRun(B, P) {
  const x = P.pick; const steps = [];
  let cat = x.path, merchantId = x.merchantId || null;
  if (x.kind === 'merchant') { const r = call('POST', '/v1/merchants/resolve', { body: { merchant: x.label } }).body; cat = r.category; merchantId = r.merchantId; steps.push(['POST /v1/merchants/resolve', `"${x.label}" → ${r.method} → <span class="mono">${cat}</span> (${r.confidence})`]); }
  else steps.push(['ltree category', `<span class="mono">${cat}</span> — a budget here counts every <span class="mono">${cat}.*</span> expense`]);
  const from = addDays(today(), -89);
  const hist = call('GET', `/v1/expenses?limit=100&from=${from}&category=${cat}` + (merchantId ? '&merchantId=' + merchantId : '')).body.data || [];
  const avgMonthly = Math.round(hist.reduce((a, e) => a + e.amountPaise, 0) / 3); const avgTicket = hist.length ? Math.round(hist.reduce((a, e) => a + e.amountPaise, 0) / hist.length) : 50000;
  steps.push(['GET /v1/expenses?category=…', `${hist.length} expenses in 90 days → avg ${rs(avgMonthly, { whole: 1 })}/month, avg ticket ${rs(avgTicket, { whole: 1 })}`]);
  const limit = P.limit || Math.max(100000, Math.round(avgMonthly / 10000) * 10000); const n = Math.max(1, Math.round(limit / avgTicket));
  const pot = call('GET', '/v1/catalog/categories/potential?category=' + cat).body.cards || []; steps.push(['GET /v1/catalog/categories/potential', `${pot.length} published cards earn here; best ${pot[0] ? pct(pot[0].rateBps) + ' on ' + pot[0].name.replace('MOCK_', '') : '—'}`]);
  const offers = call('GET', '/v1/catalog/offers?category=' + cat + (merchantId ? '&merchantId=' + merchantId : '')).body.data || []; steps.push(['GET /v1/catalog/offers', `${offers.length} active issuer offers on this category/merchant`]);
  const deals = (call('GET', '/v1/deals?category=' + rootOf(cat) + '&limit=50').body.data || []).filter((d) => isUnder(d.categoryPath, cat) || isUnder(cat, d.categoryPath)); steps.push(['GET /v1/deals?category=…', `${deals.length} marketplace deals (ltree &lt;@ on the deal's path)`]);
  const bc = call('GET', `/v1/recommendations/best-card?category=${cat}&amountPaise=${avgTicket}` + (merchantId ? '&merchantId=' + merchantId : '')).body; steps.push(['GET /v1/recommendations/best-card', `best held card for a ${rs(avgTicket, { whole: 1 })} purchase: ${bc.picks && bc.picks[0] ? esc(bc.picks[0].name) : '—'}`]);
  // offer-adjusted plan (assumptions shown)
  const best = (bc.picks || [])[0]; let rewardMonth = 0, capNote = '';
  if (best) { const per = Math.floor(avgTicket * best.rateBps / 10000); rewardMonth = per * n; if (best.headroomPaise != null && rewardMonth > best.headroomPaise) { rewardMonth = best.headroomPaise; capNote = ` (capped by this period's headroom ${rs(best.headroomPaise)})`; } }
  const heldIds = new Set(myCards().filter((c) => c.status === 'active').map((c) => c.cardProductId));
  const usable = offers.filter((o) => heldIds.has(o.cardProductId) && avgTicket >= (o.minSpendPaise || 0));
  const offerVal = (o) => o.kind === 'pct' ? Math.min(Math.floor(avgTicket * o.valueBps / 10000), o.maxDiscountPaise || Infinity) : Math.min(o.valuePaise, o.maxDiscountPaise || o.valuePaise);
  const offerMonth = usable.reduce((a, o) => a + offerVal(o) * Math.min(n, 3), 0);
  const dealMonth = deals.filter((d) => d.cardMatch !== 'other').reduce((a, d) => { const s = call('GET', `/v1/deals/${d.id}?spendPaise=${avgTicket}`, { quiet: true }).body; return a + (s.totalSavingsPaise || 0); }, 0);
  const potBest = pot.find((p) => !heldIds.has(p.cardProductId)) || null; const potMonth = potBest ? Math.min(Math.floor(limit * potBest.rateBps / 10000), potBest.capPaise && potBest.capPeriod !== 'txn' ? potBest.capPaise : Infinity) : 0;
  const net = limit - rewardMonth - offerMonth - dealMonth;
  $('#pOut', B).innerHTML = `<div class="split"><div><h3>Mapping trace</h3><div class="flow">${steps.map(([e, d], i) => `<div class="step done"><div class="h"><span class="pill">${i + 1}</span><span class="mono small">${e}</span></div><div class="d">${d}</div></div>`).join('')}</div></div>
   <div><h3>Offer-adjusted budget for <span class="mono">${cat}</span></h3>
    <div class="grid g2"><div class="card kpi"><div class="l">Limit (what you'll spend)</div><div class="v">${rs(limit, { whole: 1 })}</div><div class="s">≈ ${n} purchases of ${rs(avgTicket, { whole: 1 })}</div></div><div class="card kpi"><div class="l">Effective out-of-pocket</div><div class="v" style="color:var(--ok)">${rs(net, { whole: 1 })}</div><div class="s">${pct(Math.round((limit - net) / limit * 10000), 1)} back</div></div></div>
    ${table([{ l: 'Source', f: (r) => r[0] }, { l: 'How', f: (r) => `<span class="small">${r[1]}</span>` }, { l: '/month', n: 1, f: (r) => '−' + rs(r[2], { whole: 1 }) }], [
      ['Card reward', best ? `${esc(best.name)} at ${pct(best.rateBps)} × ${n}${capNote}` : 'no held card earns here', rewardMonth],
      ['Issuer offers', usable.length ? usable.map((o) => esc(o.title)).join('; ') + ' (assumed ≤3 uses/month)' : 'none on your cards', offerMonth],
      ['Marketplace deals', deals.filter((d) => d.cardMatch !== 'other').map((d) => esc(d.title)).join('; ') || 'none you can use', dealMonth]])}
    ${potBest && !heldIds.has(potBest.cardProductId) && (!best || potBest.rateBps > best.rateBps) ? `<div class="note small">A card you don't hold — <b>${esc(potBest.name.replace('MOCK_', ''))}</b> at ${pct(potBest.rateBps)} — would return ~${rs(potMonth, { whole: 1 })}/month here. <a href="#catalog" data-go="catalog">See it in the card marketplace →</a></div>` : ''}
    <div class="row" style="margin-top:8px"><button class="btn a" id="mkB">Create this budget (limit ${rs(limit, { whole: 1 })})</button><button class="btn" id="mkN">Create with net limit ${rs(net, { whole: 1 })}</button></div>
    <div class="small mute" style="margin-top:6px">Offers not on your cards: ${offers.filter((o) => !heldIds.has(o.cardProductId)).map((o) => esc(o.title) + ' (' + esc((o.cardName || '').replace('MOCK_', '')) + ')').join('; ') || 'none'}.</div></div></div>`;
  on('[data-go]', 'click', (e, el) => { e.preventDefault(); go(el.dataset.go); }, B);
  const mk = (lim) => { const r = call('POST', '/v1/budgets', { body: { name: x.label, period: 'monthly', categoryPath: cat, limitPaise: lim }, headers: idem() }); if (r.status === 201) toast('Budget created — it tracks ' + cat + '.* via ltree'); };
  $('#mkB', B).onclick = () => mk(limit); $('#mkN', B).onclick = () => mk(net);

    if (k === 'del') { const x = pick((e) => e.categoryPath.startsWith('shopping')) || pick(() => true); paths = [x.categoryPath]; call('DELETE', '/v1/expenses/' + x.id); }

    if (k === 'offer') { acall('POST', '/v1/admin/catalog/offers', { body: { cardProductId: DB.portfolio.cards.find((c) => c.accountId === curAcct()).cardProductId, title: '8% off cabs, max ₹80', kind: 'pct', valueBps: 800, maxDiscountPaise: 8000, categoryPath: 'travel.cab' } }); }
    if (k === 'burst') { for (let i = 0; i < 50; i++) call('POST', '/v1/expenses', { body: { amountPaise: 10000 + i * 100, merchant: i % 2 ? 'Zomato' : 'Uber', paymentMethod: 'upi' }, headers: idem(), quiet: true }); paths = ['food.delivery', 'travel.cab']; }
    const before = (DB.reco.results[curAcct()] || {}).stateHash; const s = DB.reco.recState[curAcct()] || {};
    const touched = TOUCH.slice();
    let rec;
    if (k === 'card' || k === 'offer') { rec = recoRead(curAcct()); }
    else rec = (sweep(0), DB.reco.results[curAcct()]);
    const after = (DB.reco.results[curAcct()] || {}).stateHash;
    $('#rlT', root).innerHTML = (() => { TOUCH.length = 0; TOUCH.push(...touched); return touchList(); })() || 'nothing';
    $('#rlL', root).innerHTML = paths.length ? ltreeView(paths) : (k === 'card' ? 'Catalog change: no account-level ltree work. Reward rules are matched by ltree at read (<span class="mono">:cat &lt;@ rule.category_path</span>, GIST index).' : 'Offer scope is an ltree path; best-card-now matches it at read time (<span class="mono">expense.category &lt;@ offer.category_path</span>) — nothing stored per account to recompute.');
    $('#rlN', root).innerHTML = naive(k === 'burst' ? '— 50 events coalesced into ONE recompute (debounce: sweeper claims accounts quiet for 3 s)' : '');
    const isLedger = !['card', 'offer'].includes(k);
    flow(isLedger ? [
      ['① ledger — one transaction', 'INSERT/UPDATE expenses + <b>delta upsert</b> on expense_daily_totals (before-state subtracted, after-state added: a moved day or category settles both sides) + outbox row'],
      ['② relay → Kafka <span class="mono">dexter.ledger.expense.v1</span>', 'envelope carries before + after (amount, IST day, category path, card) so consumers compute deltas without reading the ledger'],
      ['③ planning — inbox-guarded', 'load the account\'s active budgets, keep those whose path ⊇ the expense path (ltree containment), add ±amount to that (budget, period) row only; thresholds alert once per period'],
      ['④ reco — inbox-guarded', 'spend_month ±amount for (root, month); rebuild 3/6/12m windows for the touched root only; card_period_spend for best-card cap headroom; rec_state.dirty = true'],
      ['⑤ reco sweeper (debounced)', `claims dirty accounts quiet ≥3 s with FOR UPDATE SKIP LOCKED; recompute → state hash ${before ? before.slice(0, 10) : '∅'} → ${after ? after.slice(0, 10) : '∅'} ${before === after ? '(unchanged: no write, no event)' : '(changed: store + reco.recommendation.updated + SSE push)'}`],
      ['⑥ what is NOT incremental (honest)', 'the recompute itself rescoring every published card against the account\'s spend vector (≈ cards × roots, sub-millisecond). Card-benefit scoring is per account, not per category — a change in food reruns the whole account\'s ranking (but only once, only if the hash changed).', 'lit'],
    ] : k === 'card' ? [
      ['① catalog — admin publish', 'immutable version row; previous validity range closed; outbox catalog.card.published (full snapshot, compacted topic)'],
      ['② projections', 'reco catalog_cards_proj + catalog_rules_proj replaced wholesale for that card (version-guarded); portfolio + commerce projections likewise'],
      ['③ NO dirty fan-out (A-83)', 'zero rec_state rows touched — one republished card would otherwise enqueue a recompute for every account'],
      ['④ lazy freshness', `each account's next GET /v1/recommendations computes the state hash from 3 small queries; differs → recompute that one account (${rec && rec.recomputed ? 'happened just now for this account' : 'already fresh'})`],
    ] : [
      ['① catalog — offer created', 'outbox catalog.offer.changed'],
      ['② reco offers_proj upsert', 'one row; no per-account work'],
      ['③ computed at read', 'best-card-now evaluates offers for the one purchase asked about; deal savings are computed per request over ≤500 active deals. There is no stored "offer savings" to recalculate.', 'lit'],
    ]);
  }, root);
};
