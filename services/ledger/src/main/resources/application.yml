spring:
  application:
    name: ledger
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"
  # P07: runtime pool = ledger_app (RLS-bound, NOBYPASSRLS). Passwords come from the environment (.env in dev).
  datasource:
    url: jdbc:postgresql://${DEXTER_PG_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/ledger?ApplicationName=ledger
    username: ledger_app
    password: ${PG_PW_LEDGER_APP:${PG_PW_APP:}}
    hikari:
      maximum-pool-size: ${LEDGER_DB_POOL:20}
      connection-timeout: 5000
  # P08: alias + autocomplete cache (dexter-cache). Per-service ACL user (infra/redis/acl.tmpl: keys ledger:*).
  data:
    redis:
      host: ${DEXTER_REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ledger
      password: ${REDIS_PW_LEDGER:${REDIS_PW_SERVICE:}}
      timeout: 200ms
      connect-timeout: 1s
  # Migrations run as the schema owner (MASTER_PLAN 3.1); the app role has no DDL rights.
  flyway:
    user: ledger_owner
    password: ${PG_PW_LEDGER_OWNER:${PG_PW_OWNER:}}
    schemas: ledger
    clean-disabled: true

server:
  port: ${PORT_LEDGER:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Redis only caches merchant lookups (the cache bypasses to Postgres when it is down): not a readiness concern.
    redis:
      enabled: false
  metrics:
    tags:
      service: ledger

logging:
  pattern:
    # X-Request-Id on every console line (dexter-web RequestIdFilter puts it in the MDC)
    level: "%5p [%X{requestId:-}]"

dexter:
  db:
    schema: ledger
  # Keyset cursors (MASTER_PLAN 4.2): HMAC keys from the environment.
  cursor:
    active-kid: c1
    keys:
      c1: ${LEDGER_CURSOR_KEY_C1:}
  # Every request needs a user token from identity (audience "ledger"); /_dev/** stays public (dev labs).
  security:
    jwks-uri: ${IDENTITY_JWKS_URI:http://127.0.0.1:${PORT_IDENTITY:8081}/.well-known/jwks.json}
    issuer: ${IDENTITY_ISSUER:https://identity.dexter.internal}
    audience: ledger
  ledger:
    relay:
      enabled: ${LEDGER_RELAY_ENABLED:true}
      url: jdbc:postgresql://${DEXTER_PG_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/ledger?ApplicationName=ledger-relay
      username: ledger_relay
      password: ${PG_PW_LEDGER_RELAY:${PG_PW_RELAY:}}
      bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:${KAFKA_PORT:9092}}
    # P08 CSV imports: S3-compatible object store (ADR-0003; dev SeaweedFS has no S3 identities yet, P12 adds them)
    imports:
      endpoint: http://127.0.0.1:${OBJECTSTORE_PORT:8333}
      public-endpoint: ${OBJECTSTORE_PUBLIC_URL:http://localhost:${OBJECTSTORE_PORT:8333}}
      bucket: ${LEDGER_IMPORT_BUCKET:dexter-imports}
      access-key: ${OBJECTSTORE_ACCESS_KEY:dexter-dev}
      secret-key: ${OBJECTSTORE_SECRET_KEY:}

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
    json:
      # PII masking for ECS JSON logs (MASTER_PLAN 7.4)
      customizer: in.dexter.web.logging.PiiMaskingJsonMembersCustomizer

---
# DEV-ONLY P02 lab (dexter-lab, A-23): database `lab`, Kafka, Redis user `lab`. run.sh exports .env, so these
# placeholders pick up the dev passwords; the defaults match .env.example. Removed in P19.
spring:
  config:
    activate:
      on-profile: dev
dexter:
  lab:
    p02:
      enabled: true
      jdbc-url: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/lab
      owner-password: ${PG_PW_LAB_OWNER:${PG_PW_OWNER:dev_owner_pw}}
      app-password: ${PG_PW_LAB_APP:${PG_PW_APP:dev_app_pw}}
      relay-password: ${PG_PW_LAB_RELAY:${PG_PW_RELAY:dev_relay_pw}}
      kafka-bootstrap: 127.0.0.1:${KAFKA_PORT:9092}
      redis-host: 127.0.0.1
      redis-port: ${REDIS_PORT:6379}
      redis-password: ${REDIS_PW_LAB:${REDIS_PW_SERVICE:dev_redis_svc_pw}}
