spring:
  application:
    name: portfolio
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"
  # P11: runtime pool = portfolio_app (RLS-bound, NOBYPASSRLS). Passwords come from the environment (.env in dev).
  datasource:
    url: jdbc:postgresql://${DEXTER_PG_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/portfolio?ApplicationName=portfolio
    username: portfolio_app
    password: ${PG_PW_PORTFOLIO_APP:${PG_PW_APP:}}
    hikari:
      maximum-pool-size: ${PORTFOLIO_DB_POOL:20}
      connection-timeout: 5000
  # Migrations run as the schema owner (MASTER_PLAN 3.1); the app role has no DDL rights.
  flyway:
    user: portfolio_owner
    password: ${PG_PW_PORTFOLIO_OWNER:${PG_PW_OWNER:}}
    schemas: portfolio
    clean-disabled: true

server:
  port: ${PORT_PORTFOLIO:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      service: portfolio

logging:
  pattern:
    # X-Request-Id on every console line (dexter-web RequestIdFilter puts it in the MDC)
    level: "%5p [%X{requestId:-}]"

dexter:
  db:
    schema: portfolio
  # Keyset cursors (MASTER_PLAN 4.2): HMAC keys from the environment.
  cursor:
    active-kid: c1
    keys:
      c1: ${PORTFOLIO_CURSOR_KEY_C1:}
  # Every request needs a user token from identity (audience "portfolio").
  security:
    jwks-uri: ${IDENTITY_JWKS_URI:http://127.0.0.1:${PORT_IDENTITY:8081}/.well-known/jwks.json}
    issuer: ${IDENTITY_ISSUER:https://identity.dexter.internal}
    audience: portfolio
  portfolio:
    relay:
      enabled: ${PORTFOLIO_RELAY_ENABLED:true}
      url: jdbc:postgresql://${DEXTER_PG_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/portfolio?ApplicationName=portfolio-relay
      username: portfolio_relay
      password: ${PG_PW_PORTFOLIO_RELAY:${PG_PW_RELAY:}}
      bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:${KAFKA_PORT:9092}}
    # catalog-projection (dexter.catalog.card.v1) and expense-match (dexter.ledger.expense.v1)
    consumers:
      enabled: ${PORTFOLIO_CONSUMERS_ENABLED:true}
      bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:${KAFKA_PORT:9092}}
    closer:
      enabled: true
      interval: 10m

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
    json:
      # PII masking for ECS JSON logs (MASTER_PLAN 7.4)
      customizer: in.dexter.web.logging.PiiMaskingJsonMembersCustomizer
