spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"

server:
  port: ${PORT_GATEWAY:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      service: gateway

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
