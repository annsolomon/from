spring:
  application:
    name: gateway
  main:
    banner-mode: "off"
  # P19: the upstream connection pool. Reactor Netty's default (2 x cores, min 16, a short pending queue) is the
  # first thing a load test meets; a pool acquire failure counts against the route's breaker and opens it.
  cloud:
    # P19 scale r5: Spring Cloud CircuitBreaker's default Resilience4j bulkhead (25 concurrent calls per breaker)
    # rejected the 26th concurrent request, counted it as a failure and opened the breaker for everyone. Off:
    # concurrency is bounded by the rate limits and the upstream pool (ResilienceIT.manyConcurrentCalls...).
    circuitbreaker:
      bulkhead:
        resilience4j:
          enabled: false
    gateway:
      server:
        webflux:
          httpclient:
            pool:
              type: fixed
              max-connections: ${GATEWAY_POOL_MAX_CONNECTIONS:1000}
              acquire-timeout: ${GATEWAY_POOL_ACQUIRE_TIMEOUT_MS:5000}
              max-idle-time: 30s
  # P06 rate limiter: per-service ACL user (infra/redis/acl.tmpl: keys gateway:*, scripts only). 200 ms timeout.
  data:
    redis:
      host: ${DEXTER_REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: gateway
      password: ${REDIS_PW_GATEWAY:${REDIS_PW_SERVICE:}}
      timeout: 200ms
      connect-timeout: 1s

server:
  port: ${PORT_GATEWAY:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # The limiter fails open without Redis (except sign-in); Redis being down must not take the edge out of rotation.
    redis:
      enabled: false
  metrics:
    tags:
      service: gateway
      application: dexter
    distribution:
      # P19: histogram buckets so Prometheus can compute p95/p99 per route (dashboards, SLO alerts).
      percentiles-histogram:
        http.server.requests: true
        dexter.event.handle: true
  # P19 (ADR-0025): traces over OTLP to the collector; on in the live stack (scripts/run.sh), off in tests.
  tracing:
    sampling:
      probability: ${DEXTER_TRACING_SAMPLING:1.0}
    export:
      enabled: ${DEXTER_TRACING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${DEXTER_OTLP_TRACES:http://127.0.0.1:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Metrics are pulled by Prometheus from /actuator/prometheus; no OTLP push.
        enabled: false

# Edge JWT pre-check (MASTER_PLAN 7.2): identity's JWKS, audience "gateway" (identity puts it in every user token).
dexter:
  security:
    jwks-uri: ${IDENTITY_JWKS_URI:http://127.0.0.1:${PORT_IDENTITY:8081}/.well-known/jwks.json}
    issuer: ${IDENTITY_ISSUER:https://identity.dexter.internal}
    audience: gateway
  gateway:
    services:
      identity: ${GATEWAY_URI_IDENTITY:http://127.0.0.1:${PORT_IDENTITY:8081}}
      ledger: ${GATEWAY_URI_LEDGER:http://127.0.0.1:${PORT_LEDGER:8082}}
      catalog: ${GATEWAY_URI_CATALOG:http://127.0.0.1:${PORT_CATALOG:8083}}
      portfolio: ${GATEWAY_URI_PORTFOLIO:http://127.0.0.1:${PORT_PORTFOLIO:8084}}
      planning: ${GATEWAY_URI_PLANNING:http://127.0.0.1:${PORT_PLANNING:8085}}
      reco: ${GATEWAY_URI_RECO:http://127.0.0.1:${PORT_RECO:8086}}
      billing: ${GATEWAY_URI_BILLING:http://127.0.0.1:${PORT_BILLING:8087}}
      commerce: ${GATEWAY_URI_COMMERCE:http://127.0.0.1:${PORT_COMMERCE:8088}}
      audit: ${GATEWAY_URI_AUDIT:http://127.0.0.1:${PORT_AUDIT:8089}}
    activity:
      bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:${KAFKA_PORT:9092}}
      sample-rate: ${GATEWAY_ACTIVITY_SAMPLE_RATE:0.1}

---
# Local runs (run.sh) and the trail: dev endpoints routed, every request sampled, CORS for the trail origin only.
spring:
  config:
    activate:
      on-profile: dev
dexter:
  gateway:
    activity:
      sample-rate: ${GATEWAY_ACTIVITY_SAMPLE_RATE:1.0}
    headers:
      hsts: false

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
