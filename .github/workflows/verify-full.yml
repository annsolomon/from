# Full verification on a GitHub runner (Docker + network): ./scripts/verify.sh full. The release branches carry no
# trail (P19), so the trail script is gone from this workflow.
# Same commands as in the Codespace (BUILD_README §8). Reports + logs are uploaded as the `verify-full` artifact and
# printed into the job log / summary. Runs on every push to main and on demand.
name: verify-full

on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to force-push the reports to the orphan branch `verify-reports`
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: dev .env from the example
        run: cp .env.example .env
      - name: verify.sh full
        id: full
        continue-on-error: true
        run: ./scripts/verify.sh full
      - name: print report and failing logs
        if: always()
        run: |
          {
            echo '## verify-report.md'; cat verify-report.md 2>/dev/null || echo '(no report)'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for f in $(awk -F'\t' '$2=="FAIL"{print $1}' target/verify/steps.tsv 2>/dev/null); do
            echo "::group::$f.log (last 150 lines)"; tail -n 150 "target/verify/$f.log" 2>/dev/null; echo "::endgroup::"
          done
          if [ -f target/verify/mvn.log ]; then
            echo "::group::mvn.log errors and failed tests"
            grep -nE '\[ERROR\]|Tests run:.*(Failures: [1-9]|Errors: [1-9])|FAILURE!|BUILD (SUCCESS|FAILURE)|Reactor Summary' -A2 target/verify/mvn.log | head -n 400
            echo "::endgroup::"
          fi
          [ -f target/verify/smoke.txt ] && { echo "::group::smoke.txt"; cat target/verify/smoke.txt; echo "::endgroup::"; } || true
      - name: collect test reports
        if: always()
        run: |
          mkdir -p target/verify/reports
          find . -path ./target -prune -o -type d \( -name surefire-reports -o -name failsafe-reports \) -print \
            | while read -r d; do m=$(echo "$d" | sed 's#^\./##; s#/target/.*##; s#/#_#g'); mkdir -p "target/verify/reports/$m"; cp -r "$d" "target/verify/reports/$m/"; done
          # .run/vault holds the throwaway CI Vault's unseal key and tokens: never published.
          ls .run 2>/dev/null && cp -r .run target/verify/run-logs && rm -rf target/verify/run-logs/vault || true
      - name: publish reports to branch verify-reports
        # Reports as plain files on an orphan branch, readable with git (no log/artifact download needed).
        if: always()
        env:
          TOKEN: ${{ github.token }}
          FULL: ${{ steps.full.outcome }}
          # release branches report to their own branch, so main's latest report stays readable
          REPORTS: ${{ startsWith(github.ref_name, 'release/') && 'verify-reports-release' || 'verify-reports' }}
        run: |
          set +e
          out="$RUNNER_TEMP/reports"; rm -rf "$out"; mkdir -p "$out/run"
          cp verify-report.md "$out/run/" 2>/dev/null
          cp -r target/verify/. "$out/run/" 2>/dev/null
          find "$out" -type f -size +20M -exec sh -c 'tail -c 5M "$1" > "$1.tail" && rm "$1"' _ {} \;
          printf 'sha=%s\nref=%s\nrun=%s\nverify_full=%s\ntrail_check=removed\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$FULL" > "$out/run/RUN.txt"
          cd "$out" && git init -q && git checkout -q -b "$REPORTS"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -qm "verify-full run $GITHUB_RUN_ID for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$REPORTS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verify-full
          path: |
            verify-report.md
            target/verify/
      - name: result
        if: always()
        run: |
          echo "verify.sh full: ${{ steps.full.outcome }}"
          [ "${{ steps.full.outcome }}" = success ]
