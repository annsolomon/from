# Dexter v2 CI (MASTER_PLAN P00 step 7).
# PR: static + build + unit. main: + integration tests (Testcontainers; runners have Docker).
# Supply chain (MASTER_PLAN 7.5): third-party actions are pinned to major tags for now and are
# switched to full commit SHAs in P19. Trivy stays disabled until images exist.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: ./scripts/verify.sh static
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: verify-static, path: verify-report.md }

  unit:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: '25', cache: maven }
      - run: ./scripts/verify.sh unit
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: verify-unit, path: verify-report.md }

  integration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: '25', cache: maven }
      # -U for the same reason verify.sh uses it (A-88): a cached resolution failure must not be sticky.
      - run: mvn -B -U verify

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Image scans (Trivy) and the ZAP baseline run in verify-full (full.image-scan, full.zap-baseline: ADR-0027),
  # where the jars and the running stack exist.
